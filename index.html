<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SmartGrowth - Loading</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

    body {
      background-color: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #333;
    }

    /* === Full Page Container seperti ManajemenAdmin === */
    .main-container {
      width: 100%;
      height: 100vh;
      background: linear-gradient(180deg, #f9ffff 0%, #d9f7f2 40%, #c6ecf9 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
    }

    /* Logo Button */
    .logo-btn {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background: white;
      border: none;
      outline: none;
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .logo-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    }

    .logo-btn img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 50%;
    }

    .app-title {
      font-size: 36px;
      font-weight: bold;
      color: #29abe2;
      margin-top: 25px;
      letter-spacing: -1px;
    }

    .app-title span:first-child {
      color: #1c1c1c;
    }

    .app-subtitle {
      font-size: 16px;
      color: #555;
      margin-top: 8px;
    }

    /* Background shapes */
    .shape {
      position: absolute;
      border-radius: 40px;
      filter: blur(12px);
      opacity: 0.8;
      z-index: 0;
    }

    .shape.top {
      width: 600px;
      height: 280px;
      background: linear-gradient(135deg, rgba(180,255,220,0.9), rgba(220,255,250,0.8));
      top: -80px;
      right: -120px;
      transform: rotate(-25deg);
    }

    .shape.bottom {
      width: 600px;
      height: 280px;
      background: linear-gradient(135deg, rgba(150,220,255,0.9), rgba(210,250,230,0.8));
      bottom: -80px;
      left: -120px;
      transform: rotate(25deg);
    }

    /* Animasi halus */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(40px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .content {
      z-index: 2;
      text-align: center;
      animation: fadeIn 1.2s ease-in-out;
    }
  </style>
</head>
<body>
  <div class="main-container">
    <div class="shape top"></div>
    <div class="shape bottom"></div>

    <div class="content">
      <button class="logo-btn" onclick="window.location.href='onboarding1.html'">
        <img src="image/LogoSmartGrowth.png" alt="SmartGrowth Logo">
      </button>
      <div class="app-title"><span>Smart</span>Growth</div>
      <div class="app-subtitle">PCR (Pantau Cegah Risiko) Stunting</div>
    </div>
  </div>
</body>
</html>
